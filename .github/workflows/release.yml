name: Build and Release Preview APK

on:
  push:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/preview'
    timeout-minutes: 30
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # 必须赋予写入权限，以便能自动创建 Release 并上传包

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Kotlin 插件需要 JetBrains Runtime 21 的 toolchain；foojay 在线下载已不可用，
      # 这里预装 JBR 21 让 Gradle 直接使用本地 toolchain，不再走网络下载。
      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ -z "${VERSION_NAME}" ]]; then
            echo "Unable to resolve versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          RELEASE_TAG="preview-v${VERSION_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build with Gradle
        env:
          LYRICS_PLUS_STATS_ENDPOINT: ${{ vars.LYRICS_PLUS_STATS_ENDPOINT }}
        run: bash scripts/assemble-official-release.sh testDebugUnitTest

      - name: Name Preview APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/lyrics-plus-preview.apk

      - name: Calculate SHA-256 Hash
        id: calc_sha
        run: |
          SHA256=$(sha256sum app/build/outputs/apk/release/lyrics-plus-preview.apk | awk '{ print $1 }')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      # 步骤 4：将打包好的 APK 上传并发布到 GitHub Release，同时把 Hash 写入正文
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/lyrics-plus-preview.apk
          name: Preview ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## 📦 Preview ${{ steps.version.outputs.tag }}
            
            Branch: `preview`
            Commit: `${{ github.sha }}`
            This is a preview build. It uses the same application ID and signing key as the stable app.

            ### 🔒 文件校验和 (SHA-256 Checksums)
            * **lyrics-plus-preview.apk**: `${{ steps.calc_sha.outputs.sha256 }}`
            
            > [!TIP]
            > **安全提示：** 您可以在本地运行命令来验证下载的 APK 文件的完整性：
            > * **Windows (PowerShell):** `Get-FileHash lyrics-plus-preview.apk -Algorithm SHA256`
            > * **Linux / macOS:** `sha256sum lyrics-plus-preview.apk`
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
