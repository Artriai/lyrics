name: Build and Release lyrics

on:
  push:
    branches:
      - lyrics
  workflow_dispatch:

concurrency:
  group: lyrics-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/lyrics'
    timeout-minutes: 30
    needs: native-ui
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # 必须赋予写入权限，以便能自动创建 Release 并上传包

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Kotlin 插件需要 JetBrains Runtime 21 的 toolchain；foojay 在线下载已不可用，
      # 这里预装 JBR 21 让 Gradle 直接使用本地 toolchain，不再走网络下载。
      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ -z "${VERSION_NAME}" ]]; then
            echo "Unable to resolve versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          RELEASE_TAG="lyrics-v${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build with Gradle
        env:
          LYRICS_PLUS_STATS_ENDPOINT: ${{ vars.LYRICS_PLUS_STATS_ENDPOINT }}
        run: bash scripts/assemble-official-release.sh testDebugUnitTest -PlyricsBuildNumber="${GITHUB_RUN_NUMBER}"

      - name: Name Preview APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/lyrics.apk

      - name: Calculate SHA-256 Hash
        id: calc_sha
        run: |
          SHA256=$(sha256sum app/build/outputs/apk/release/lyrics.apk | awk '{ print $1 }')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      # 步骤 4：将打包好的 APK 上传并发布到 GitHub Release，同时把 Hash 写入正文
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/lyrics.apk
          name: lyrics ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## 📦 lyrics ${{ steps.version.outputs.tag }}
            
            Branch: `lyrics`
            Commit: `${{ github.sha }}`
            Standalone lyric cue board. Installs alongside Lyrics Plus; no Spotify or notification access required.

            ### 🔒 文件校验和 (SHA-256 Checksums)
            * **lyrics.apk**: `${{ steps.calc_sha.outputs.sha256 }}`
            
            > [!TIP]
            > **安全提示：** 您可以在本地运行命令来验证下载的 APK 文件的完整性：
            > * **Windows (PowerShell):** `Get-FileHash lyrics.apk -Algorithm SHA256`
            > * **Linux / macOS:** `sha256sum lyrics.apk`
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-ui:
    name: Verify lyrics on Android
    if: github.ref == 'refs/heads/lyrics'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Android UI tests
        run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Test offline library and cue navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            mkdir -p ui-screenshots
            adb pull /sdcard/Pictures/lyrics-ui ui-screenshots
      - name: Upload UI screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-ui-check
          path: |
            ui-screenshots
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
