name: Release Preview (temporary)

on:
  push:
    branches:
      - agent/fix-qq-search-romaji
    paths:
      - .github/workflows/release-preview-tmp.yml

permissions:
  contents: read

jobs:
  build:
    name: Build release APK (preview, no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-plus-release-preview
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
